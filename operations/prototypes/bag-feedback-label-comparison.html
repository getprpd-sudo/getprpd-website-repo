<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PRPD label comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      color: #172117;
      background: #dcded8;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 0 0 20px; font-size: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    figure { margin: 0; padding: 18px; background: #fffefa; border: 1px solid #1e2e1e; }
    figcaption { margin-bottom: 12px; font-weight: 800; }
    img { display: block; width: 100%; height: 360px; object-fit: contain; background: #eef0ec; }
  </style>
</head>
<body>
  <h1>PRPD label system comparison</h1>
  <div class="grid">
    <figure>
      <figcaption>Current Avery 5168 meal-label reference</figcaption>
      <img src="../../output/rendered/PRPD_Current_Meal_Label_Reference.png" alt="Current PRPD meal label studio reference">
    </figure>
    <figure>
      <figcaption>New Avery 5168 customer bag-feedback label</figcaption>
      <img src="../../output/rendered/PRPD_Bag_Feedback_Label_Demo_Crop.png" alt="New PRPD bag feedback label prototype">
    </figure>
  </div>
</body>
</html>
